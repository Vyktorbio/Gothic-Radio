<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Gothic Rádio" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Gothic Rádio. Aperte o play." />
  <title>Gothic Rádio</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <audio id="audio-player" preload="none"></audio>
  <div class="radio-shell">
    <header class="radio-header">
      <button id="brand-reset" class="radio-wordmark" aria-label="Gothic Rádio, mostrar todas as músicas">Gothic<span>rádio</span></button>
      <div class="radio-account"><div id="install-control"></div><button id="btn-connect">Entrar</button></div>
    </header>
    <nav class="radio-nav" aria-label="Músicas">
      <button id="btn-open-menu">Músicas <span id="count-total">0</span></button>
      <button id="btn-top-favs">Favoritas <span id="count-favs">0</span></button>
      <button id="btn-rescan" title="Atualizar músicas" aria-label="Atualizar músicas">Atualizar</button>
    </nav>
    <main>
      <div id="status-banner" role="status" aria-live="polite" class="hidden"></div>
      <section class="radio-deck" aria-label="Player da Gothic Rádio">
        <div class="radio-status"><span><i aria-hidden="true"></i><span id="play-state-label">Sem sinal</span></span><span id="mode-indicator">Sequência</span></div>
        <div class="radio-track"><h1 id="track-title">—</h1><p id="track-artist">Entre para ouvir</p></div>
        <div class="radio-track-meta"><span id="station-sub">GOTHIC / 0 faixas</span><button id="btn-fav-current">Favoritar</button></div>
        <div class="radio-seek"><label class="sr-only" for="seek-slider">Posição da música</label><input id="seek-slider" type="range" min="0" max="100" step="0.5" value="0" /><div><span id="time-current">00:00</span><span id="time-total">00:00</span></div></div>
        <div class="radio-transport"><button id="btn-prev" aria-label="Faixa anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14M19 5 8 12l11 7Z"/></svg></button><button id="btn-play">Play</button><button id="btn-next" aria-label="Próxima faixa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v14M5 5l11 7-11 7Z"/></svg></button></div>
        <div class="radio-up-next" aria-live="polite"><span class="next-label">A seguir</span><div><p id="next-track-title">—</p><p id="next-track-artist">Escolha uma faixa</p></div></div>
        <div class="radio-options"><button id="btn-shuffle" aria-pressed="false">Aleatório</button><button id="btn-only-favs" aria-pressed="false">Só favoritas</button></div>
        <div class="radio-volume"><button id="btn-mute" aria-label="Silenciar ou ativar som">Vol.</button><label class="sr-only" for="vol-slider">Volume</label><input id="vol-slider" type="range" min="0" max="1" step="0.01" value="0.85" /><span id="vol-label">85%</span></div>
      </section>
    </main>
    <footer class="radio-footer"><span>GOTHIC RÁDIO</span><button id="btn-search-top">Buscar faixas ↗</button></footer>
  </div>
  <div id="drawer" class="hidden" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-panel">
      <div class="drawer-heading"><h2 id="drawer-title">Músicas <span id="drawer-count">0</span></h2><button id="btn-close-drawer" aria-label="Fechar músicas">×</button></div>
      <label class="sr-only" for="search-input">Buscar música ou artista</label><input id="search-input" type="search" placeholder="Música ou artista" />
      <div id="artist-chips"></div><div id="tracks-list"></div>
    </div>
  </div>
  <span id="vfd-clock" hidden></span>
  <script>
    const storage = {
      getItem(key) { try { return localStorage.getItem(key); } catch { return null; } },
      setItem(key, value) { try { localStorage.setItem(key, value); return true; } catch { return false; } },
      removeItem(key) { try { localStorage.removeItem(key); } catch {} },
    };
    const COLECAO_FOLDER_ID = storage.getItem('radio_colecao_folder_id_v1') || '1lWs0LtOkqLMjOgX_zGRP9MmaDdMdxgnV';
    const AUDIO_EXT = /\.(mp3|mp4|wav|m4a|m4b|m4p|m4r|flac|ogg|oga|opus|aac|wma|aiff|aif|alac|ape|wv|mpc|tta|mp2|mpga|mpa|weba|webm|3gp|ac3|dts|amr|au|pcm|mid|midi)(\s*\(\d+\))?$/i;
    const NON_AUDIO_EXT = /\.(jpg|jpeg|png|gif|webp|pdf|txt|doc|docx|zip|rar|ini|db|srt|cue|log|m3u)(\s*\(\d+\))?$/i;

    const EMBEDDED_TRACKS = [];
    const EMBEDDED_TOKEN = "";
    const EMBEDDED_EMAIL = "";

    let tracks = [];
    try {
      const saved = JSON.parse(storage.getItem('gothic_radio_tracks_v4') || 'null');
      if (Array.isArray(saved) && saved.length > 0) tracks = saved.filter(t => t && typeof t.id === 'string' && typeof t.title === 'string' && typeof t.artist === 'string');
    } catch (e) {}
    if (tracks.length === 0 && EMBEDDED_TRACKS.length > 0) {
      tracks = EMBEDDED_TRACKS;
      try { storage.setItem('gothic_radio_tracks_v4', JSON.stringify(tracks)); } catch (e) {}
    }

    let savedFavorites = [];
    try { const value = JSON.parse(storage.getItem('radio_drive_favorite_ids_v1') || '[]'); if (Array.isArray(value)) savedFavorites = value; } catch {}
    let favIds = new Set(savedFavorites);
    let savedEmail = storage.getItem('radio_drive_user_email_v1') || EMBEDDED_EMAIL || '';
    let accessToken = storage.getItem('gothic_radio_drive_token_v1') || storage.getItem('radio_drive_token_v1') || EMBEDDED_TOKEN || null;
    let tokenExpiresAt = Number(storage.getItem('gothic_radio_drive_token_exp_v1') || storage.getItem('radio_drive_token_exp_v1') || (EMBEDDED_TOKEN ? String(Date.now() + 50 * 60 * 1000) : '0'));
    let selectedArtist = 'ALL';
    let onlyFavs = false;
    let isShuffle = false;
    let searchQuery = '';
    let savedPlayback = {};
    try { savedPlayback = JSON.parse(storage.getItem('gothic_radio_playback_v1') || '{}') || {}; } catch {}
    let currentTrack = tracks.find(t => t.id === savedPlayback.trackId) || tracks[0] || null;
    let memoryRevision = 0;
    let visibleTrackLimit = 100;
    let catalogVersion = null;
    let restoreTrackTime = true;
    let lastPositionSave = 0;
    isShuffle = savedPlayback.shuffle === true;
    let isPlaying = false;
    let pendingAuthPromise = null;
    let nextPlan = null;
    let playbackHistory = [];
    let playbackRequest = 0;
    let loadedTrackId = null;

    const audio = document.getElementById('audio-player');
    const statusBanner = document.getElementById('status-banner');
    audio.volume = typeof savedPlayback.volume === 'number' && Number.isFinite(savedPlayback.volume) ? Math.max(0, Math.min(1, savedPlayback.volume)) : 0.85;
    document.getElementById('vol-slider').value = audio.volume;
    document.getElementById('vol-label').textContent = Math.round(audio.volume * 100) + '%';

    function openMusicMemory() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) return reject(new Error('Storage unavailable'));
        const request = indexedDB.open('GothicRadioMemoryDB', 1);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains('folder_memory')) request.result.createObjectStore('folder_memory');
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
        request.onblocked = () => reject(new Error('Storage blocked'));
      });
    }

    async function writeMusicMemory(list) {
      const snapshot = { tracks: list, meta: { folderId: COLECAO_FOLDER_ID, trackCount: list.length, lastSyncedAt: new Date().toISOString(), scanComplete: true, catalogVersion } };
      const localSaved = storage.setItem('gothic_radio_tracks_v4', JSON.stringify(list));
      storage.setItem('gothic_radio_meta_v4', JSON.stringify(snapshot.meta));
      if (!localSaved) storage.removeItem('gothic_radio_tracks_v4');
      let db;
      let databaseSaved = false;
      try {
        db = await openMusicMemory();
        await new Promise((resolve, reject) => {
          const tx = db.transaction('folder_memory', 'readwrite');
          tx.objectStore('folder_memory').put(snapshot, 'gothic_radio_snapshot_v4');
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
          tx.onabort = () => reject(tx.error);
        });
        databaseSaved = true;
      } catch {} finally { db?.close(); }
      if (!localSaved && !databaseSaved) showStatus('Não foi possível salvar a lista neste navegador. Verifique o espaço disponível.');
      return localSaved || databaseSaved;
    }

    async function restoreMusicMemory() {
      const revision = memoryRevision;
      let db;
      try {
        db = await openMusicMemory();
        const saved = await new Promise((resolve, reject) => {
          const tx = db.transaction('folder_memory', 'readonly');
          const request = tx.objectStore('folder_memory').get('gothic_radio_snapshot_v4');
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        if (revision !== memoryRevision || !Array.isArray(saved?.tracks) || saved.meta?.folderId !== COLECAO_FOLDER_ID) return;
        let localMeta = null;
        try { localMeta = JSON.parse(storage.getItem('gothic_radio_meta_v4') || 'null'); } catch {}
        if (tracks.length && localMeta?.lastSyncedAt && localMeta.lastSyncedAt > (saved.meta?.lastSyncedAt || '')) return;
        catalogVersion = saved.meta?.catalogVersion || null;
        tracks = saved.tracks.filter(t => t && typeof t.id === 'string' && typeof t.title === 'string' && typeof t.artist === 'string');
        currentTrack = tracks.find(t => t.id === currentTrack?.id || t.id === savedPlayback.trackId) || tracks[0] || null;
        renderUI();
      } catch {} finally { db?.close(); }
    }

    function rememberPlayback() {
      const time = audio.src ? audio.currentTime : (savedPlayback.trackId === currentTrack?.id ? savedPlayback.time || 0 : 0);
      savedPlayback = { trackId: currentTrack?.id || null, time, volume: audio.volume, shuffle: isShuffle };
      storage.setItem('gothic_radio_playback_v1', JSON.stringify(savedPlayback));
    }
    window.addEventListener('pagehide', rememberPlayback);
    audio.onpause = () => { isPlaying = false; rememberPlayback(); updateMediaPosition(); renderUI(); };
    audio.onplay = () => { isPlaying = true; setupMediaSession(); renderUI(); };
    audio.onloadedmetadata = () => {
      if (restoreTrackTime && currentTrack?.id === savedPlayback.trackId && Number.isFinite(audio.duration)) {
        audio.currentTime = Math.max(0, Math.min(savedPlayback.time || 0, audio.duration));
      }
      restoreTrackTime = false;
      updateMediaPosition();
    };

    function saveToken(tok, email, incomingTracks) {
      if (typeof tok !== 'string' || !tok.trim()) return;
      if (!tracks.length && Array.isArray(incomingTracks) && incomingTracks.length) {
        tracks = incomingTracks.filter(t => t && typeof t.id === 'string' && typeof t.title === 'string' && typeof t.artist === 'string');
        currentTrack = tracks[0] || null;
        memoryRevision++;
        void writeMusicMemory(tracks);
      }
      accessToken = tok.trim();
      tokenExpiresAt = Date.now() + 55 * 60 * 1000;
      if (email) {
        savedEmail = email;
        try { storage.setItem('radio_drive_user_email_v1', email); } catch (e) {}
      }
      try {
        storage.setItem('gothic_radio_drive_token_v1', accessToken);
        storage.setItem('gothic_radio_drive_token_exp_v1', String(tokenExpiresAt));
      } catch (e) {}
      showStatus('');
      renderUI();
    }

    function fmtTime(sec) {
      if (!sec || !Number.isFinite(sec)) return '00:00';
      const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function showStatus(msg) {
      if (!msg) { statusBanner.classList.add('hidden'); return; }
      statusBanner.textContent = msg;
      statusBanner.classList.remove('hidden');
    }

    function isAudio(name, mime) {
      if (!name || name.startsWith('.')) return false;
      if (NON_AUDIO_EXT.test(name)) return false;
      if (AUDIO_EXT.test(name)) return true;
      const m = (mime || '').toLowerCase();
      if (m.startsWith('audio/') || m === 'video/mp4' || m === 'application/ogg' || m === 'application/flac' || m === 'application/x-flac') return true;
      return false;
    }

    async function ensureValidToken(interactive = false) {
      if (accessToken && Date.now() < tokenExpiresAt - 60000) return accessToken;
      if (!interactive) return null;
      if (pendingAuthPromise) return pendingAuthPromise;
      if (typeof window.gothicRadioSignIn !== 'function') {
        showStatus('O login ainda está carregando. Aguarde e toque em Entrar novamente.');
        return null;
      }
      // Downloads and cache reads may consume the click activation on iOS.
      // Ask for a fresh tap instead of opening a popup that Safari will block.
      if (navigator.userActivation && !navigator.userActivation.isActive) {
        showStatus('Toque em Entrar para conectar sua conta e continuar ouvindo.');
        return null;
      }
      showStatus('Conectando ao Google…');
      const button = document.getElementById('btn-connect');
      button.disabled = true;
      pendingAuthPromise = (async () => {
        try {
          const result = await window.gothicRadioSignIn(savedEmail);
          if (!result?.accessToken) throw new Error('missing-token');
          saveToken(result.accessToken, result.email || '');
          return accessToken;
        } catch (error) {
          const messages = {
            'auth/unauthorized-domain': 'O domínio da rádio ainda não foi autorizado no Firebase. Adicione vyktorbio.github.io em Authentication → Settings → Authorized domains.',
            'auth/popup-blocked': 'O navegador bloqueou o login. Abra a rádio no Safari ou Chrome e permita a janela de login.',
            'auth/popup-closed-by-user': 'Login não concluído. Toque em Entrar para tentar novamente.',
            'auth/cancelled-popup-request': 'Login interrompido. Toque em Entrar para tentar novamente.',
            'auth/network-request-failed': 'Não foi possível conectar ao Google. Verifique sua conexão e tente novamente.',
            'auth/operation-not-allowed': 'O login com Google precisa ser ativado nas configurações de autenticação da rádio.',
          };
          showStatus(messages[error?.code] || 'Não foi possível entrar. Tente novamente.');
          return null;
        } finally {
          button.disabled = false;
          pendingAuthPromise = null;
        }
      })();
      return pendingAuthPromise;
    }

    async function driveListAll(q, fields) {
      let all = [], pageToken = '';
      do {
        const url = 'https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(q) +
          '&fields=nextPageToken,files(' + fields + ')&pageSize=1000&supportsAllDrives=true&includeItemsFromAllDrives=true' +
          (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : '');
        let res = null;
        for (let attempt = 0; attempt < 5; attempt++) {
          res = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
          if (res.ok) break;
          await new Promise(r => setTimeout(r, 500 * Math.pow(2, attempt)));
        }
        if (!res || !res.ok) throw new Error('Drive API ' + (res ? res.status : 'erro'));
        const data = await res.json();
        if (data.files) all.push(...data.files);
        pageToken = data.nextPageToken || '';
      } while (pageToken);
      return all;
    }

    async function scanColecao(force = false) {
      if (!force && tracks.length > 0) {
        renderUI();
        return;
      }
      const tok = await ensureValidToken(true);
      if (!tok) return;
      showStatus('Atualizando músicas…');
      try {
        const artistByFolderId = new Map();
        const visitedFolders = new Set([COLECAO_FOLDER_ID]);
        let frontier = [{ id: COLECAO_FOLDER_ID, artist: null }];
        const rawFiles = [];

        for (let depth = 0; frontier.length > 0; depth++) {
          const nextFrontier = [];
          for (let i = 0; i < frontier.length; i += 20) {
            const chunk = frontier.slice(i, i + 20);
            const parentOr = chunk.map(c => "'" + c.id + "' in parents").join(' or ');
            const items = await driveListAll("(" + parentOr + ") and trashed = false", "id,name,mimeType,size,parents,shortcutDetails");
            for (const item of items) {
              const isSub = item.mimeType === 'application/vnd.google-apps.folder' ||
                (item.mimeType === 'application/vnd.google-apps.shortcut' && item.shortcutDetails?.targetMimeType === 'application/vnd.google-apps.folder');
              if (isSub) {
                const fid = item.shortcutDetails?.targetId || item.id;
                const parentNode = chunk.find(c => (item.parents || []).includes(c.id));
                const folderName = (item.name || '').trim();
                const normName = folderName.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                const isContainer = normName === 'colecao' || normName === 'musicas';
                const artist = (parentNode && parentNode.artist) ? parentNode.artist : (isContainer ? null : folderName);
                if (artist) artistByFolderId.set(fid, artist);
                if (!visitedFolders.has(fid)) {
                  visitedFolders.add(fid);
                  nextFrontier.push({ id: fid, artist });
                }
              } else {
                rawFiles.push(item);
              }
            }
            showStatus('ATUALIZANDO MÚSICAS... ' + rawFiles.length + ' ARQUIVOS LIDOS');
          }
          frontier = nextFrontier;
        }

        const parsed = [];
        const seen = new Set();
        for (const f of rawFiles) {
          if (seen.has(f.id)) continue;
          const eid = f.shortcutDetails?.targetId || f.id;
          const emime = f.shortcutDetails?.targetMimeType || f.mimeType || '';
          if (!isAudio(f.name, emime)) continue;
          seen.add(f.id);
          const clean = f.name.replace(AUDIO_EXT, '').trim();
          const parts = clean.split(/\s+[-–—]\s+/);
          const folderArtist = artistByFolderId.get((f.parents || [])[0]) || 'Artista desconhecido';
          const artist = parts.length >= 2 ? parts[0].trim() : folderArtist;
          const title = parts.length >= 2 ? parts.slice(1).join(' - ').trim() : clean;
          parsed.push({ id: f.id, streamFileId: eid, name: f.name, title, artist, sourceFolder: 'Coleção', mimeType: emime, sizeBytes: Number(f.size || 0) });
        }

        memoryRevision++;
        tracks = parsed;
        currentTrack = tracks.find(t => t.id === currentTrack?.id) || tracks[0] || null;
        showStatus('');
        renderUI();
        await writeMusicMemory(tracks);
        if (navigator.storage?.persist) { try { await navigator.storage.persist(); } catch {} }
      } catch (e) {
        showStatus('ENTRE NOVAMENTE PARA RENOVAR O ACESSO');
      }
    }

    function getQueue() {
      return tracks.filter(t => {
        if (onlyFavs && !favIds.has(t.id)) return false;
        if (selectedArtist !== 'ALL' && t.artist !== selectedArtist) return false;
        if (searchQuery && !(t.title.toLowerCase().includes(searchQuery) || t.artist.toLowerCase().includes(searchQuery))) return false;
        return true;
      });
    }

    async function playTrack(track, rememberHistory = true) {
      if (!track) return;
      const request = ++playbackRequest;
      if (rememberHistory && currentTrack && currentTrack.id !== track.id) {
        playbackHistory.push(currentTrack.id);
        if (playbackHistory.length > 200) playbackHistory.shift();
      }
      audio.pause();
      restoreTrackTime = track.id === savedPlayback.trackId;
      currentTrack = track;
      renderUI();
      try {
        showStatus('CARREGANDO ÁUDIO...');
        const cache = ('caches' in window) ? await caches.open('gothic-radio-audio-cache-v1') : null;
        const cacheKey = 'https://gothic-radio.local/audio/' + encodeURIComponent(track.id);
        let blob = null;
        if (cache) {
          const hit = await cache.match(cacheKey);
          if (hit) blob = await hit.blob();
        }
        if (!blob) {
          let tok = await ensureValidToken(false);
          if (!tok) {
            tok = await ensureValidToken(true);
          }
          if (!tok) return;
          const id = track.streamFileId || track.id;
          let res = await fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(id) + '?alt=media&supportsAllDrives=true', {
            headers: { Authorization: 'Bearer ' + tok }
          });
          if (res.status === 401 || res.status === 403) {
            accessToken = null;
            tok = await ensureValidToken(true);
            if (!tok) return;
            res = await fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(id) + '?alt=media&supportsAllDrives=true', {
              headers: { Authorization: 'Bearer ' + tok }
            });
          }
          if (!res.ok) throw new Error('Status ' + res.status);
          blob = await res.blob();
          if (cache) await cache.put(cacheKey, new Response(blob));
        }
        if (request !== playbackRequest) return;
        loadedTrackId = track.id;
        if (audio.src.startsWith('blob:')) URL.revokeObjectURL(audio.src);
        audio.src = URL.createObjectURL(blob);
        await audio.play();
        if (request !== playbackRequest) return;
        isPlaying = true;
        showStatus('');
        setupMediaSession();
        renderUI();
      } catch (e) {
        if (request !== playbackRequest) return;
        isPlaying = false;
        showStatus('ENTRE PARA CONTINUAR OUVINDO');
        renderUI();
      }
    }

    function getNextTrack(q = getQueue()) {
      if (!q.length) { nextPlan = null; return null; }
      const key = JSON.stringify([currentTrack?.id, isShuffle, onlyFavs, selectedArtist, searchQuery, memoryRevision, q.length]);
      if (nextPlan?.key === key) {
        const planned = q.find(t => t.id === nextPlan.id);
        if (planned) return planned;
      }
      const index = q.findIndex(t => t.id === currentTrack?.id);
      let next;
      if (isShuffle && q.length > 1) {
        const choices = q.filter(t => t.id !== currentTrack?.id);
        next = choices[Math.floor(Math.random() * choices.length)];
      } else next = q[(index + 1) % q.length];
      nextPlan = { key, id: next.id };
      return next;
    }

    function nextTrack() {
      const next = getNextTrack();
      if (next) return playTrack(next);
    }

    function prevTrack() {
      if (audio.currentTime > 4 && loadedTrackId === currentTrack?.id) {
        audio.currentTime = 0;
        updateMediaPosition();
        return;
      }
      const q = getQueue();
      if (!q.length) return;
      while (playbackHistory.length) {
        const id = playbackHistory.pop();
        const previous = q.find(t => t.id === id);
        if (previous) return playTrack(previous, false);
      }
      const idx = q.findIndex(t => t.id === currentTrack?.id);
      return playTrack(q[(idx - 1 + q.length) % q.length], false);
    }

    async function resumePlayback() {
      if (!audio.src || loadedTrackId !== currentTrack?.id) return playTrack(currentTrack || tracks[0]);
      try { await audio.play(); } catch { showStatus('Toque em Play na rádio para continuar.'); }
    }

    function updateMediaPosition() {
      if (!navigator.mediaSession) return;
      try {
        navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
        if (loadedTrackId !== currentTrack?.id || !Number.isFinite(audio.duration) || audio.duration <= 0) {
          navigator.mediaSession.setPositionState?.();
          return;
        }
        navigator.mediaSession.setPositionState?.({
          duration: audio.duration, playbackRate: audio.playbackRate || 1,
          position: Math.max(0, Math.min(audio.currentTime || 0, audio.duration)),
        });
      } catch {} // Media Session support varies between browsers.
    }

    function setupMediaSession() {
      const session = navigator.mediaSession;
      if (!session) return;
      if (currentTrack && loadedTrackId === currentTrack.id && typeof MediaMetadata !== 'undefined') {
        try {
          session.metadata = new MediaMetadata({ title: currentTrack.title, artist: currentTrack.artist, album: 'Gothic Rádio',
            artwork: [{ src: new URL('./pwa-512x512.png', document.baseURI).href, sizes: '512x512', type: 'image/png' }] });
        } catch {}
      }
      const handlers = {
        play: resumePlayback, pause: () => audio.pause(),
        nexttrack: nextTrack, previoustrack: prevTrack,
        seekto: details => {
          if (Number.isFinite(details.seekTime) && Number.isFinite(audio.duration) && audio.duration > 0) {
            audio.currentTime = Math.max(0, Math.min(details.seekTime, audio.duration));
            updateMediaPosition();
          }
        },
        seekbackward: null, seekforward: null,
      };
      for (const [action, handler] of Object.entries(handlers)) {
        try { session.setActionHandler(action, handler); } catch {}
      }
      updateMediaPosition();
    }

    function renderUI() {
      const q = getQueue();
      const upcoming = getNextTrack(q);
      document.getElementById('next-track-title').textContent = upcoming?.title || 'Nenhuma faixa na fila';
      document.getElementById('next-track-artist').textContent = upcoming?.artist || 'Escolha músicas ou ajuste os filtros';
      document.body.classList.toggle('is-playing', isPlaying);
      document.getElementById('btn-shuffle').setAttribute('aria-pressed', String(isShuffle));
      document.getElementById('btn-only-favs').setAttribute('aria-pressed', String(onlyFavs));
      document.getElementById('count-total').textContent = tracks.length;
      document.getElementById('count-favs').textContent = favIds.size;
      document.getElementById('drawer-count').textContent = q.length;
      document.getElementById('station-sub').textContent = (onlyFavs ? 'Favoritas' : selectedArtist === 'ALL' ? 'Todas as músicas' : selectedArtist) + ' · ' + q.length.toLocaleString('pt-BR') + ' faixas';
      document.getElementById('mode-indicator').textContent = isShuffle ? 'Aleatório' : 'Sequência';
      document.getElementById('play-state-label').textContent = isPlaying ? 'Tocando' : (tracks.length ? 'Parado' : 'Sem sinal');
      document.getElementById('track-title').textContent = currentTrack ? currentTrack.title : (tracks.length ? 'Escolha uma faixa' : '—');
      document.getElementById('track-artist').textContent = currentTrack ? currentTrack.artist : 'Entre para ouvir';
      document.getElementById('btn-play').textContent = isPlaying ? 'Pausar' : 'Play';
      const isFav = currentTrack && favIds.has(currentTrack.id);
      document.getElementById('btn-fav-current').textContent = isFav ? 'Favorita' : 'Favoritar';
      document.getElementById('btn-connect').textContent = (accessToken && Date.now() < tokenExpiresAt) ? 'Conectado' : 'Entrar';

      // Artist filter chips inside drawer
      const artists = ['ALL', ...Array.from(new Set(tracks.map(t => t.artist))).sort()];
      const chipsEl = document.getElementById('artist-chips');
      chipsEl.innerHTML = '';
      artists.slice(0, 40).forEach(art => {
        const btn = document.createElement('button');
        btn.className = 'artist-chip' + (selectedArtist === art ? ' selected' : '');
        btn.textContent = art === 'ALL' ? 'Todos (' + tracks.length + ')' : art;
        btn.onclick = () => { selectedArtist = art; visibleTrackLimit = 100; renderUI(); };
        chipsEl.appendChild(btn);
      });

      const listEl = document.getElementById('tracks-list');
      listEl.innerHTML = '';
      q.slice(0, visibleTrackLimit).forEach(t => {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'track-row' + (currentTrack?.id === t.id ? ' selected' : '');
        const text = document.createElement('div');
        text.className = 'track-row-text';
        const title = document.createElement('div');
        title.className = 'track-row-title';
        title.textContent = t.title;
        const artist = document.createElement('div');
        artist.className = 'track-row-artist';
        artist.textContent = t.artist;
        text.append(title, artist);
        row.append(text);
        row.onclick = () => { playTrack(t); document.getElementById('drawer').classList.add('hidden'); };
        listEl.appendChild(row);
      });
      if (q.length > visibleTrackLimit) {
        const more = document.createElement('button');
        more.className = 'load-more';
        more.textContent = 'Mostrar mais (' + Math.min(visibleTrackLimit, q.length) + ' / ' + q.length + ')';
        more.onclick = () => { const scroll = listEl.scrollTop; visibleTrackLimit += 100; renderUI(); listEl.scrollTop = scroll; };
        listEl.appendChild(more);
      }

    }

    document.getElementById('brand-reset').onclick = () => { onlyFavs = false; selectedArtist = 'ALL'; searchQuery = ''; renderUI(); };
    document.getElementById('btn-connect').onclick = async () => {
      const tok = await ensureValidToken(true);
      if (tok && tracks.length === 0) scanColecao(true);
      else renderUI();
    };
    document.getElementById('btn-rescan').onclick = () => scanColecao(true);
    document.getElementById('btn-open-menu').onclick = () => document.getElementById('drawer').classList.remove('hidden');
    document.getElementById('btn-search-top').onclick = () => document.getElementById('drawer').classList.remove('hidden');
    document.getElementById('btn-close-drawer').onclick = () => document.getElementById('drawer').classList.add('hidden');
    document.getElementById('btn-top-favs').onclick = () => { onlyFavs = !onlyFavs; renderUI(); };
    document.getElementById('btn-play').onclick = () => { if (audio.paused || !audio.src) void resumePlayback(); else audio.pause(); };
    document.getElementById('btn-next').onclick = nextTrack;
    document.getElementById('btn-prev').onclick = prevTrack;
    document.getElementById('btn-shuffle').onclick = () => { isShuffle = !isShuffle; renderUI(); };
    document.getElementById('btn-only-favs').onclick = () => { onlyFavs = !onlyFavs; renderUI(); };
    document.getElementById('btn-fav-current').onclick = () => {
      if (!currentTrack) return;
      if (favIds.has(currentTrack.id)) favIds.delete(currentTrack.id); else favIds.add(currentTrack.id);
      storage.setItem('radio_drive_favorite_ids_v1', JSON.stringify(Array.from(favIds)));
      renderUI();
    };
    document.getElementById('seek-slider').oninput = (e) => {
      audio.currentTime = Number(e.target.value || 0);
    };
    document.getElementById('vol-slider').oninput = (e) => {
      const v = Number(e.target.value || 0);
      audio.volume = v;
      document.getElementById('vol-label').textContent = Math.round(v * 100) + '%';
    };
    document.getElementById('btn-mute').onclick = () => {
      audio.muted = !audio.muted;
      document.getElementById('vol-label').textContent = audio.muted ? 'MUTE' : Math.round(audio.volume * 100) + '%';
    };
    document.getElementById('search-input').oninput = (e) => { searchQuery = e.target.value.toLowerCase(); visibleTrackLimit = 100; renderUI(); };
    audio.onended = nextTrack;
    audio.onseeked = updateMediaPosition;
    audio.onratechange = updateMediaPosition;
    setupMediaSession();
    audio.ontimeupdate = () => {
      updateMediaPosition();
      if (Date.now() - lastPositionSave > 5000) { rememberPlayback(); lastPositionSave = Date.now(); }
      document.getElementById('seek-slider').value = audio.currentTime || 0;
      document.getElementById('seek-slider').max = audio.duration || 100;
      document.getElementById('vfd-clock').textContent = fmtTime(audio.currentTime);
      document.getElementById('time-current').textContent = fmtTime(audio.currentTime);
      document.getElementById('time-total').textContent = fmtTime(audio.duration);

    };
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') document.getElementById('drawer').classList.add('hidden');
      if (e.ctrlKey || e.metaKey || e.altKey || document.querySelector('dialog[open]')) return;
      const tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (tag === 'BUTTON' && (e.code === 'Space' || e.key === ' ')) return;
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        document.getElementById('btn-play').click();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextTrack();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevTrack();
      }
    });
    renderUI();
    async function loadPublishedCatalog() {
      await restoreMusicMemory();
      if (tracks.length) return;
      const revision = memoryRevision;
      let imported = [];
      try {
        showStatus('Carregando músicas…');
        const response = await fetch('./catalog/manifest.json');
        if (!response.ok) throw new Error('Catalog unavailable');
        const manifest = await response.json();
        for (let i = 0; i < manifest.parts.length; i += 3) {
          const batches = await Promise.all(manifest.parts.slice(i, i + 3).map(async (part) => {
            const response = await fetch('./catalog/' + part.file);
            if (!response.ok) throw new Error('Catalog part unavailable');
            const rows = await response.json();
            if (rows.length !== part.count) throw new Error('Incomplete catalog');
            return rows.map(row => ({ id: row[0], title: row[1], artist: manifest.artists[row[2]] || 'Artista desconhecido', streamFileId: row[3] || row[0] }));
          }));
          if (revision !== memoryRevision) return;
          imported.push(...batches.flat());
          showStatus('Carregando músicas… ' + imported.length.toLocaleString('pt-BR') + ' / ' + manifest.count.toLocaleString('pt-BR'));
        }
        if (imported.length !== manifest.count || revision !== memoryRevision) return;
        tracks = imported;
        catalogVersion = manifest.version;
        memoryRevision++;
        currentTrack = tracks.find(t => t.id === savedPlayback.trackId) || tracks[0] || null;
        renderUI();
        showStatus('');
        await writeMusicMemory(tracks);
      } catch {
        if (revision === memoryRevision) showStatus('Não foi possível carregar a lista. Verifique a conexão e tente abrir novamente.');
      }
    }
    const musicReady = loadPublishedCatalog();
  </script>
  <script type="module" src="/src/player-install.tsx"></script>
</body>
